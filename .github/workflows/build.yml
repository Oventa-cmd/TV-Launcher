name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signierschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64-Secret - APK wird mit Debug-Schluessel signiert"
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2> kt.err; then
              echo "::notice::Keystore OK (Alias gefunden)"
            else
              echo "::error::Keystore-Pruefung fehlgeschlagen: $(head -c 300 kt.err | tr '\n' ' ')"
            fi
          fi
          set +e
          gradle :app:assembleRelease --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -A12 "What went wrong" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^e: " build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TV-Launcher-1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TV-Launcher 1.0.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
